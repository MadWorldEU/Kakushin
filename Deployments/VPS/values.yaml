namespace: kakushin
imagePullPolicy: "IfNotPresent"

clusterIssuer:
  enabled: false
  name: "letsencrypt-kakushin"
  # Production overrides it with --set clusterIssuer.email=... from the CLUSTER_ISSUER_EMAIL secret
  email: "info@kakushin.dev"

ingress:
  className: "traefik"
  domain: "kakushin.dev"
  tlsSecret: "kakushin-tls"

# Database for Keycloak
postgres:
  name: postgres
  port: 5432
  image:
    # Keycloak 26 supports PostgreSQL 13 to 17
    repository: "postgres"
    tag: "17"
  username: "keycloak"
  # Demo password for local development only. Production overrides it with --set postgres.password=...
  # from the POSTGRES_PASSWORD secret in the deploy workflow.
  password: "keycloak-local-dev"
  database: "keycloak"
  storageSize: "1Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
      # Also holds the pg_dump for Velero (postgres.backup.dumpSizeLimit)
      ephemeral-storage: "512Mi"
  # Prepares the database for Velero backups; without Velero these annotations have no effect.
  backup:
    enabled: true
    # Max time the pg_dump (backup) and pg_restore (restore) hooks may take before they fail
    hookTimeout: "2m"
    # Max size of the pg_dump file; must fit within postgres.resources.limits.ephemeral-storage
    dumpSizeLimit: "256Mi"

keycloak:
  name: keycloak
  image:
    repository: "quay.io/keycloak/keycloak"
    tag: "26.4"
  adminUsername: "admin"
  # Demo password for local development only. Production overrides it with --set keycloak.adminPassword=...
  # from the KEYCLOAK_ADMIN_PASSWORD secret in the deploy workflow.
  adminPassword: "admin-local-dev"
  servicePort: 8080
  ports:
    http: 8080
    # Keycloak serves the /health endpoints on the management port
    health: 9000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "128Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "512Mi"

velero:
  enabled: true

  # Namespace where Velero runs. Install Velero first with
  # Deployments/Velero/values.yaml (see the command at the top of that file).
  namespace: velero

  # OVHcloud S3 credentials (Public Cloud > Object Storage > S3 users).
  # Do not commit these. Pass them at install time:
  #   --set velero.credentials.accessKeyId=... --set velero.credentials.secretAccessKey=...
  # or create the secret yourself (key "cloud", AWS credentials file format)
  # and set existingSecret.
  credentials:
    existingSecret: ""
    accessKeyId: ""        # injected by the pipeline
    secretAccessKey: ""    # injected by the pipeline

  storageLocation:
    name: ovh
    default: true
    bucket: "madworld-backups"# your OVH bucket name
    prefix: vps               # folder inside the bucket
    region: de                # gra, sbg, rbx, de, uk, waw, bhs, ...
    # Defaults to https://s3.<region>.io.cloud.ovh.net
    s3Url: ""

  schedules:
    # Daily backup of all namespaces, including the files on every PVC.
    - name: daily
      schedule: "0 3 * * *"   # every day at 03:00 (cluster time)
      ttl: 168h0m0s           # keep 7 days
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - default
        - kube-system
        - kube-public
        - kube-node-lease
        - cert-manager
        - traefik
        - velero
